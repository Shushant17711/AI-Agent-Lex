[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lex-agent"
version = "2.0.0"
description = "A planner, a coder and a reviewer that work on your project together, from the terminal or a local web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shushant Kumar Choudhary", email = "shushant1771@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0",
  "httpx>=0.27",
  "rich>=13.7",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lex = "lex.cli:main"

[project.urls]
Homepage = "https://github.com/Shushant17711/AI-Agent-Lex"

[tool.hatch.build.targets.wheel]
packages = ["lex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
